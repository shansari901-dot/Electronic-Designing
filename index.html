<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Electronic Designing</title>


<style>

/* =====================================================
   ELECTRONIC DESIGNING
   PREMIUM ELECTRONIC THEME
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    radial-gradient(
      circle at 20% 10%,
      #073b72 0%,
      #031b38 28%,
      #020b1d 65%,
      #010714 100%
    );

  color:#ffffff;

  min-height:100vh;

}


/* =====================================================
   ELECTRONIC BACKGROUND
===================================================== */

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  opacity:.20;

  background-image:

    linear-gradient(
      135deg,
      transparent 0%,
      transparent 47%,
      #00d9ff 48%,
      transparent 49%
    );

  background-size:140px 140px;

}


/* =====================================================
   COMMON
===================================================== */

.hidden{
  display:none !important;
}

.container{

  width:
    min(
      1180px,
      calc(100% - 28px)
    );

  margin:auto;

}

button,
input,
select{

  font-family:inherit;

}


/* =====================================================
   GLOW
===================================================== */

.glow{

  text-shadow:
    0 0 8px #00d9ff,
    0 0 20px #0077ff;

}


/* =====================================================
   LOGIN
===================================================== */

.loginPage{

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:20px;

}


.loginBox{

  width:
    min(
      420px,
      100%
    );

  padding:32px;

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      rgba(7,35,70,.96),
      rgba(1,12,29,.98)
    );

  border:
    1px solid
    rgba(0,217,255,.35);

  box-shadow:

    0 0 20px
    rgba(0,153,255,.20),

    0 0 60px
    rgba(0,153,255,.08),

    inset 0 0 30px
    rgba(0,217,255,.04);

}


.loginLogo{

  width:95px;

  height:95px;

  margin:0 auto 15px;

  border-radius:24px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:45px;

  font-weight:bold;

  color:#ffffff;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #00d9ff 55%,
      #0877ff
    );

  color:#06172e;

  box-shadow:
    0 0 25px
    rgba(0,217,255,.5);

}


.loginTitle{

  text-align:center;

  font-size:28px;

  font-weight:900;

  letter-spacing:2px;

}


.loginSub{

  text-align:center;

  color:#7bdcff;

  margin-bottom:25px;

}


.fieldLabel{

  display:block;

  margin:
    14px 0 7px;

  color:#a9eaff;

  font-size:13px;

  font-weight:bold;

}


input,
select{

  width:100%;

  padding:13px 14px;

  border-radius:12px;

  border:
    1px solid
    rgba(0,217,255,.28);

  background:
    rgba(1,15,35,.85);

  color:#ffffff;

  outline:none;

}


input:focus,
select:focus{

  border-color:#00d9ff;

  box-shadow:
    0 0 12px
    rgba(0,217,255,.25);

}


select option{

  background:#06172e;

  color:#ffffff;

}


.btn{

  width:100%;

  padding:13px 16px;

  margin-top:10px;

  border:0;

  border-radius:12px;

  cursor:pointer;

  font-weight:800;

  color:#ffffff;

  background:
    linear-gradient(
      90deg,
      #006cff,
      #00cfff
    );

  box-shadow:
    0 0 18px
    rgba(0,190,255,.22);

  transition:.2s;

}


.btn:hover{

  transform:translateY(-1px);

  box-shadow:
    0 0 25px
    rgba(0,217,255,.45);

}


.btn.secondary{

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(0,217,255,.25);

}


.btn.danger{

  background:
    linear-gradient(
      90deg,
      #9d1515,
      #e52c2c
    );

}


.btn.green{

  background:
    linear-gradient(
      90deg,
      #007c63,
      #00d69c
    );

}


.loginError{

  margin-top:12px;

  padding:11px;

  border-radius:10px;

  background:
    rgba(255,50,50,.12);

  border:
    1px solid
    rgba(255,70,70,.35);

  color:#ffaaaa;

}


/* =====================================================
   HEADER
===================================================== */

.topHeader{

  position:sticky;

  top:0;

  z-index:50;

  backdrop-filter:
    blur(15px);

  background:
    rgba(1,12,29,.88);

  border-bottom:
    1px solid
    rgba(0,217,255,.18);

}


.headerInner{

  min-height:70px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

}


.brand{

  display:flex;

  align-items:center;

  gap:12px;

}


.brandIcon{

  width:48px;

  height:48px;

  border-radius:14px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #00d9ff,
      #006cff
    );

  color:#06172e;

  box-shadow:
    0 0 18px
    rgba(0,217,255,.35);

}


.brandText{

  font-size:17px;

  font-weight:900;

  letter-spacing:1.3px;

}


.brandText span{

  color:#00d9ff;

}


.logoutBtn{

  width:auto;

  margin:0;

  padding:
    10px 15px;

}


/* =====================================================
   HERO
===================================================== */

.hero{

  padding:
    38px 0 25px;

}


.heroBox{

  position:relative;

  overflow:hidden;

  padding:
    30px;

  border-radius:26px;

  background:

    radial-gradient(
      circle at 90% 20%,
      rgba(0,210,255,.22),
      transparent 30%
    ),

    linear-gradient(
      135deg,
      rgba(4,45,85,.94),
      rgba(1,13,30,.98)
    );

  border:
    1px solid
    rgba(0,217,255,.22);

  box-shadow:
    0 0 35px
    rgba(0,125,255,.12);

}


.heroCircuit{

  position:absolute;

  right:-20px;

  top:-35px;

  font-size:150px;

  opacity:.06;

}


.heroTitle{

  margin:0;

  font-size:
    clamp(
      28px,
      5vw,
      50px
    );

  font-weight:900;

  letter-spacing:2px;

}


.heroTitle span{

  color:#00d9ff;

}


.heroText{

  color:#9bdff5;

  max-width:700px;

  line-height:1.6;

}


/* =====================================================
   SECTION
===================================================== */

.sectionTitle{

  display:flex;

  align-items:center;

  gap:10px;

  margin:
    24px 0 13px;

  font-size:21px;

}


.sectionTitle .icon{

  width:38px;

  height:38px;

  border-radius:11px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    rgba(0,217,255,.10);

  border:
    1px solid
    rgba(0,217,255,.28);

}


/* =====================================================
   CARDS
===================================================== */

.card{

  padding:20px;

  margin-bottom:16px;

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(5,34,65,.90),
      rgba(1,14,31,.94)
    );

  border:
    1px solid
    rgba(0,217,255,.16);

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.18);

}


.cardTitle{

  font-size:17px;

  font-weight:800;

  margin-bottom:13px;

}


.grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        210px,
        1fr
      )
    );

  gap:13px;

}


.small{

  color:#7fb6cc;

  font-size:12px;

  line-height:1.5;

}


.info{

  padding:12px;

  margin-top:10px;

  border-radius:12px;

  color:#aeeeff;

  background:
    rgba(0,174,255,.07);

  border:
    1px solid
    rgba(0,174,255,.14);

}


.success{

  color:#aaffdf;

  background:
    rgba(0,200,150,.08);

  border:
    1px solid
    rgba(0,220,170,.20);

}


.error{

  color:#ffb1b1;

  background:
    rgba(255,50,50,.08);

  border:
    1px solid
    rgba(255,60,60,.20);

}


/* =====================================================
   MACHINE CARDS
===================================================== */

.machineGrid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        250px,
        1fr
      )
    );

  gap:14px;

}


.machineCard{

  padding:18px;

  border-radius:18px;

  cursor:pointer;

  background:
    linear-gradient(
      145deg,
      rgba(7,45,82,.9),
      rgba(1,15,32,.95)
    );

  border:
    1px solid
    rgba(0,217,255,.18);

  transition:.2s;

}


.machineCard:hover{

  transform:
    translateY(-3px);

  border-color:#00cfff;

  box-shadow:
    0 0 25px
    rgba(0,180,255,.18);

}


.machineName{

  font-size:17px;

  font-weight:900;

  color:#ffffff;

}


.machineMeta{

  color:#81cce7;

  font-size:12px;

  line-height:1.7;

  margin:
    8px 0;

}


.machineButtons{

  display:flex;

  gap:7px;

}


.machineButtons button{

  margin:0;

}


.miniBtn{

  padding:
    9px 10px;

  font-size:12px;

}


/* =====================================================
   TWO COLUMN
===================================================== */

.twoColumn{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:16px;

}


@media(max-width:750px){

  .twoColumn{

    grid-template-columns:1fr;

  }

}


/* =====================================================
   FILE BOX
===================================================== */

.fileBox{

  border:
    1px dashed
    rgba(0,217,255,.35);

  border-radius:15px;

  padding:15px;

  background:
    rgba(0,150,255,.035</script>

</body>
</html>
