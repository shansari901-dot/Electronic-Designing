<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Electronic Designing</title>

<style>

/* =========================================================
   BASIC
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    color:#ffffff;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(0,119,255,.28),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(0,220,255,.12),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #061d3d,
            #031329 45%,
            #020817
        );

    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.06;

    background-image:
        linear-gradient(
            135deg,
            transparent 0 47%,
            #00d9ff 48%,
            transparent 49%
        );

    background-size:120px 120px;
}

.hidden{
    display:none !important;
}

.container{
    width:min(1120px,calc(100% - 24px));
    margin:auto;
}

button,
input,
select{
    font-family:inherit;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:13px 15px;
    margin-top:10px;
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;

    background:
        linear-gradient(
            90deg,
            #006eff,
            #00cfff
        );

    box-shadow:
        0 0 18px rgba(0,187,255,.18);
}

.btn:hover{
    box-shadow:
        0 0 25px rgba(0,210,255,.35);
}

.btn.secondary{
    background:#102945;
    border:1px solid rgba(0,210,255,.20);
}

.btn.green{
    background:
        linear-gradient(
            90deg,
            #00876c,
            #00cfa0
        );
}

.btn.red{
    background:
        linear-gradient(
            90deg,
            #9c1717,
            #e02a2a
        );
}

.btn.small{
    padding:9px 10px;
    margin-top:0;
    font-size:12px;
}

/* =========================================================
   LOGIN
========================================================= */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.loginBox{
    width:min(410px,100%);
    padding:28px;
    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(8,38,74,.97),
            rgba(2,13,30,.98)
        );

    border:
        1px solid rgba(0,215,255,.24);

    box-shadow:
        0 0 35px rgba(0,120,255,.15);
}

.logoBox{
    width:90px;
    height:90px;
    margin:0 auto 16px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:24px;

    font-weight:900;
    font-size:34px;

    color:#05172d;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #12d7ff 55%,
            #126aff
        );

    box-shadow:
        0 0 25px rgba(0,211,255,.35);
}

.loginTitle{
    text-align:center;
    font-size:26px;
    font-weight:900;
    letter-spacing:1.5px;
}

.loginTitle span{
    color:#00d9ff;
}

.loginSub{
    text-align:center;
    color:#8bdcf4;
    margin:8px 0 22px;
    font-size:13px;
}

label{
    display:block;
    color:#9cdff1;
    font-size:13px;
    font-weight:700;
    margin:10px 0 6px;
}

input,
select{
    width:100%;
    padding:12px 13px;

    color:white;
    background:#05172d;

    border:
        1px solid rgba(0,214,255,.20);

    border-radius:11px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#00d9ff;
    box-shadow:
        0 0 12px rgba(0,211,255,.20);
}

select option{
    background:#061b35;
    color:white;
}

.loginError{
    margin-top:10px;
    padding:10px;
    border-radius:10px;

    color:#ffb3b3;

    background:
        rgba(255,50,50,.08);

    border:
        1px solid rgba(255,80,80,.20);
}

.loginHint{
    text-align:center;
    margin-top:15px;
    color:#668ea5;
    font-size:12px;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:100;

    background:
        rgba(2,15,32,.92);

    backdrop-filter:blur(14px);

    border-bottom:
        1px solid rgba(0,215,255,.15);
}

.headerInner{
    min-height:68px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brandLogo{
    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    color:#041426;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            white,
            #00dbff,
            #076dff
        );

    box-shadow:
        0 0 16px rgba(0,210,255,.30);
}

.brandName{
    font-size:15px;
    font-weight:900;
    letter-spacing:1px;
}

.brandName span{
    color:#00d9ff;
}

.logout{
    width:auto;
    margin:0;
    padding:9px 13px;
}

/* =========================================================
   NAV
========================================================= */

.nav{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:15px 0;
}

.nav button{
    margin:0;
    padding:11px 5px;

    border-radius:11px;

    background:#09223e;
    border:1px solid rgba(0,210,255,.12);

    color:#8cd8ee;
}

.nav button.active{
    background:
        linear-gradient(
            90deg,
            #075fff,
            #00c8ff
        );

    color:white;

    border-color:#00d9ff;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    margin-top:14px;
}

.heroBox{
    padding:25px;
    border-radius:22px;

    background:
        radial-gradient(
            circle at 90% 20%,
            rgba(0,217,255,.18),
            transparent 28%
        ),
        linear-gradient(
            145deg,
            rgba(7,45,84,.92),
            rgba(2,15,31,.97)
        );

    border:
        1px solid rgba(0,210,255,.17);

    box-shadow:
        0 12px 35px rgba(0,0,0,.20);
}

.heroTitle{
    margin:0;
    font-size:clamp(28px,6vw,45px);
    font-weight:900;
    letter-spacing:2px;
}

.heroTitle span{
    color:#00d9ff;
}

.heroText{
    margin:10px 0 0;
    color:#8bcde1;
    line-height:1.55;
}

/* =========================================================
   SECTIONS
========================================================= */

.pageSection{
    margin-top:18px;
}

.sectionTitle{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:20px;
    font-weight:900;

    margin-bottom:11px;
}

.sectionIcon{
    width:37px;
    height:37px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:
        rgba(0,210,255,.09);

    border:
        1px solid rgba(0,210,255,.20);
}

.card{
    padding:18px;
    margin-bottom:14px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(7,37,69,.91),
            rgba(2,15,31,.96)
        );

    border:
        1px solid rgba(0,210,255,.14);

    box-shadow:
        0 8px 28px rgba(0,0,0,.16);
}

.cardTitle{
    font-size:16px;
    font-weight:800;
    margin-bottom:10px;
}

.info{
    margin-top:10px;
    padding:12px;

    border-radius:11px;

    color:#aeefff;

    background:
        rgba(0,183,255,.055);

    border:
        1px solid rgba(0,200,255,.12);

    font-size:13px;
    line-height:1.6;
}

.success{
    color:#a8ffdf;

    background:
        rgba(0,190,150,.06);

    border-color:
        rgba(0,220,170,.18);
}

.error{
    color:#ffb0b0;

    background:
        rgba(255,50,50,.06);

    border-color:
        rgba(255,60,60,.18);
}

.smallText{
    color:#7299ad;
    font-size:12px;
    line-height:1.55;
}

/* =========================================================
   MACHINE GRID
========================================================= */

.machineGrid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(245px,1fr)
        );
    gap:12px;
}

.machineCard{
    padding:16px;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #0a2c4e,
            #04172d
        );

    border:
        1px solid rgba(0,211,255,.14);
}

.machineCard:hover{
    border-color:#00cfff;
}

.machineName{
    font-weight:900;
    font-size:16px;
}

.machineDetails{
    color:#7fc5db;
    font-size:12px;
    line-height:1.75;
    margin:9px 0 12px;
}

.machineActions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

/* =========================================================
   SETUP
========================================================= */

.setupGrid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );
    gap:12px;
}

.fileBox{
    margin-top:7px;
    padding:12px;

    border-radius:13px;

    border:
        1px dashed rgba(0,210,255,.28);

    background:
        rgba(0,150,255,.03);
}

.fileName{
    margin-top:7px;
    color:#80e4fa;
    font-size:12px;
}

/* =========================================================
   DESIGN
========================================================= */

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.preview{
    width:100%;
    max-height:360px;
    margin-top:12px;

    object-fit:contain;

    border-radius:12px;

    background:white;

    border:1px solid
        rgba(0,210,255,.15);
}

.toggleGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:10px;
}

.toggle{
    margin:0;
    padding:11px 5px;
    font-size:12px;

    background:#0a2743;

    border:
        1px solid rgba(0,210,255,.15);

    color:#8fd9ed;
}

.toggle.active{
    background:
        linear-gradient(
            90deg,
            #0062ff,
            #00cfff
        );

    color:white;
    border-color:#00d9ff;
}

/* =========================================================
   DOWNLOAD
========================================================= */

.download{
    display:block;
    margin-top:12px;
    padding:13px;

    text-align:center;
    text-decoration:none;

    color:white;
    font-weight:900;
